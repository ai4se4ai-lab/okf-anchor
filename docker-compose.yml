# OKF Anchor local development stack (skill: okf-docker-dev).
#
#   docker compose up -d --build   # everything: postgres, redis, Kubo IPFS, anvil EVM,
#                                   # Prisma migrations, the OKFAnchor contract deploy,
#                                   # the app, and the worker.
#
# No profiles: this is the one-command bring-up. `--build` is only needed to pick up
# code changes on a rebuild — the very first run builds automatically since no image
# exists yet.
#
# Every *_PROVIDER switch in .env (local | ipfs | evm | ...) still only changes which
# backend the app *talks to* at runtime — it never changes which containers start.
# `STORAGE_PROVIDER=local`/`ANCHOR_PROVIDER=local` still works with no external network;
# the ipfs/chain/contracts services just sit there unused in that case.
#
# `chain` (Anvil) persists its state to the chain-data volume (--state), so blocks,
# the deployed OKFAnchor, and every Anchored event survive a restart — matching
# postgres/redis/ipfs. `contracts` deploys OKFAnchor as the deployer's very first
# transaction (deterministic address — see EVM_ANCHOR_CONTRACT_ADDRESS in
# .env.example) but is now idempotent: it skips the deploy when bytecode already
# exists at that address, so a persisted chain is never double-deployed. It exits 0;
# the app and worker wait for that before starting. To start the chain over from
# genesis: `docker compose down` then `docker volume rm okf-anchor_chain-data`
# (drop okf-anchor_postgres-data too, or the DB will hold Anchor rows pointing at
# blocks the fresh chain no longer has).

name: okf-anchor

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: okf
      POSTGRES_PASSWORD: okf_local_dev
      POSTGRES_DB: okf_anchor
    ports:
      # Host ports are offset (55432 / 56379 / …) to coexist with other local
      # Compose stacks. In-cluster services still talk over the default ports.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okf -d okf_anchor"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ipfs:
    image: ipfs/kubo:v0.32.1
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    ports:
      # Bind host is configurable per endpoint (see IPFS_*_BIND in .env.example).
      # Default 127.0.0.1 — the RPC API (5001) has full admin capabilities
      # (add/remove pins, rewrite config, read keys, stop the node) and must
      # never reach the public Internet; keep it loopback-only unless you are on
      # a trusted LAN and something off-host genuinely needs RPC. The gateway
      # (8080) is read-only content retrieval — safe to widen to the LAN so other
      # machines / Docker stacks can fetch by CID. The app itself always talks to
      # Kubo over the compose network as http://ipfs:5001, not via these mappings.
      - "${IPFS_API_BIND:-127.0.0.1}:55001:5001" # API
      - "${IPFS_GATEWAY_BIND:-127.0.0.1}:58080:8080" # gateway
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  chain:
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    restart: unless-stopped
    # anvil's default user (foundry, uid 1000) can't write to the root-owned
    # chain-data volume mountpoint, so --state below would silently never dump.
    user: "0:0"
    entrypoint: ["anvil"]
    # No --block-time: Anvil's default (mine one block per transaction, instantly)
    # is all EVM_CONFIRMATIONS=1 (the only supported value today — .env.example,
    # docs/evm-anchor.md) needs, and a fixed interval logs a full block report every
    # tick forever, drowning out every other service's logs in `docker compose up`.
    #
    # --state persists the whole chain (blocks + the deployed OKFAnchor + every
    # Anchored event) to the chain-data volume, loaded back on the next start and
    # re-dumped on graceful shutdown / every --state-interval seconds. Without it
    # a restart wiped the chain to genesis while Postgres kept its AssetVersion /
    # Anchor rows — so re-submitted bundles hit the canonical-hash idempotency
    # short-circuit, never re-anchored, and the live-chain page showed nothing.
    command:
      - "--host"
      - "0.0.0.0"
      - "--chain-id"
      - "31337"
      - "--state"
      - "/state/anvil-state.json"
      - "--state-interval"
      - "10"
    volumes:
      - chain-data:/state
    ports:
      - "58545:8545"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cast block-number --rpc-url http://127.0.0.1:8545 > /dev/null 2>&1 || exit 1"
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies Prisma migrations to `postgres` (a fresh DB has no tables at all).
  # Reuses the already-built app image instead of a separate one, so this never falls
  # out of sync with what the app was actually compiled against.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: "no"
    entrypoint: ["sh", "/app/packages/db/node_modules/.bin/prisma"]
    command: ["migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: deploys OKFAnchor to `chain` as the deployer's first-ever tx, so it always
  # lands at the same address (see EVM_ANCHOR_CONTRACT_ADDRESS in .env.example). Exits 0
  # and stays stopped; `app`/`worker` wait for that exit before starting.
  #
  # Idempotent: now that `chain` persists its state (chain-data volume), a later
  # `up` / `--force-recreate` would otherwise redeploy on top of the existing
  # chain and shift the address (nonce no longer 0). Skip the deploy when bytecode
  # already exists at the expected address.
  contracts:
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    restart: "no"
    working_dir: /contracts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ "$$(cast code $$EVM_ANCHOR_CONTRACT_ADDRESS --rpc-url http://chain:8545 2>/dev/null)" != "0x" ] && [ -n "$$(cast code $$EVM_ANCHOR_CONTRACT_ADDRESS --rpc-url http://chain:8545 2>/dev/null)" ];
        then echo "OKFAnchor already deployed at $$EVM_ANCHOR_CONTRACT_ADDRESS - skipping deploy";
        else forge script script/DeployOKFAnchor.s.sol --rpc-url http://chain:8545 --broadcast; fi
    env_file:
      - .env
    volumes:
      - ./contracts:/contracts
    depends_on:
      chain:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
      REDIS_URL: redis://redis:6379
      # In-cluster Kubo hostname — always overridden here regardless of what a
      # host-side .env sets IPFS_API_URL to (which is typically the host-mapped
      # 127.0.0.1:55001, unreachable from inside this container).
      IPFS_API_URL: http://ipfs:5001
      # In-cluster Anvil hostname — same reasoning as IPFS_API_URL above (a
      # host-side .env typically sets EVM_RPC_URL to the host-mapped
      # 127.0.0.1:58545, unreachable from inside this container).
      EVM_RPC_URL: http://chain:8545
      # A container's stdout is a pipe, not a TTY, so both Next.js's own CLI
      # colors and @okf-anchor/logger's ANSI colors would otherwise auto-disable
      # even though `docker compose up` forwards them to a real terminal.
      FORCE_COLOR: "1"
    ports:
      # Web app reachable at http://localhost:3002
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      contracts:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: ["node", "workers/dist/main.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
      REDIS_URL: redis://redis:6379
      # In-cluster Kubo hostname — always overridden here regardless of what a
      # host-side .env sets IPFS_API_URL to (which is typically the host-mapped
      # 127.0.0.1:55001, unreachable from inside this container).
      IPFS_API_URL: http://ipfs:5001
      # In-cluster Anvil hostname — same reasoning as IPFS_API_URL above (a
      # host-side .env typically sets EVM_RPC_URL to the host-mapped
      # 127.0.0.1:58545, unreachable from inside this container).
      EVM_RPC_URL: http://chain:8545
      # See the same setting on `app` above: forces @okf-anchor/logger's ANSI
      # colors on despite the container's stdout being a non-TTY pipe.
      FORCE_COLOR: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      contracts:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  ipfs-data:
  chain-data:
