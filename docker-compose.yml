# OKF Anchor local development stack (skill: okf-docker-dev).
#
#   docker compose up -d                      # postgres + redis (offline pipeline)
#   docker compose --profile ipfs up -d       # + Kubo IPFS  (STORAGE_PROVIDER=ipfs)
#   docker compose --profile chain up -d      # + anvil EVM  (ANCHOR_PROVIDER=evm)
#   docker compose --profile app up -d --build# + the app image
#
# Default *_PROVIDER=local means the full validate→canonicalize→hash→graph→store→
# anchor pipeline runs with only postgres + redis and no external network.

name: okf-anchor

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: okf
      POSTGRES_PASSWORD: okf_local_dev
      POSTGRES_DB: okf_anchor
    ports:
      # Host ports are offset (55432 / 56379 / …) to coexist with other local
      # Compose stacks. In-cluster services still talk over the default ports.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okf -d okf_anchor"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ipfs:
    image: ipfs/kubo:v0.32.1
    profiles: ["ipfs"]
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    ports:
      - "55001:5001" # API
      - "58080:8080" # gateway
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  chain:
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    profiles: ["chain"]
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "58545:8545"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cast block-number --rpc-url http://127.0.0.1:8545 > /dev/null 2>&1 || exit 1"
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
      REDIS_URL: redis://redis:6379
    ports:
      # Web app reachable at http://localhost:3002
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    profiles: ["app"]
    restart: unless-stopped
    command: ["node", "workers/dist/main.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  ipfs-data:
