# OKF Anchor local development stack (skill: okf-docker-dev).
#
#   docker compose up -d --build   # everything: postgres, redis, Kubo IPFS, anvil EVM,
#                                   # Prisma migrations, the OKFAnchor contract deploy,
#                                   # the app, and the worker.
#
# No profiles: this is the one-command bring-up. `--build` is only needed to pick up
# code changes on a rebuild — the very first run builds automatically since no image
# exists yet.
#
# Every *_PROVIDER switch in .env (local | ipfs | evm | ...) still only changes which
# backend the app *talks to* at runtime — it never changes which containers start.
# `STORAGE_PROVIDER=local`/`ANCHOR_PROVIDER=local` still works with no external network;
# the ipfs/chain/contracts services just sit there unused in that case.
#
# `contracts` deploys OKFAnchor to `chain` once it's healthy, as the deployer's very
# first transaction — which is why its address is deterministic (see the comment next to
# EVM_ANCHOR_CONTRACT_ADDRESS in .env.example). It exits 0 after deploying; the app and
# worker wait for that before starting. If `chain` ever loses its state independently
# (e.g. a crash + auto-restart) without `contracts` re-running, redeploy by hand with
# `pnpm contracts:deploy:anvil` or `docker compose up --force-recreate contracts`.

name: okf-anchor

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: okf
      POSTGRES_PASSWORD: okf_local_dev
      POSTGRES_DB: okf_anchor
    ports:
      # Host ports are offset (55432 / 56379 / …) to coexist with other local
      # Compose stacks. In-cluster services still talk over the default ports.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okf -d okf_anchor"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ipfs:
    image: ipfs/kubo:v0.32.1
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    ports:
      # Bound to loopback only: the RPC API (5001) has full admin capabilities
      # and must never reach the public Internet. The app talks to it over the
      # compose network as http://ipfs:5001, not through this host mapping —
      # this is for host-side dev tooling only.
      - "127.0.0.1:55001:5001" # API
      - "127.0.0.1:58080:8080" # gateway (read-only retrieval; still loopback-only in dev)
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  chain:
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "58545:8545"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cast block-number --rpc-url http://127.0.0.1:8545 > /dev/null 2>&1 || exit 1"
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies Prisma migrations to `postgres` (a fresh DB has no tables at all).
  # Reuses the already-built app image instead of a separate one, so this never falls
  # out of sync with what the app was actually compiled against.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: "no"
    entrypoint: ["sh", "/app/packages/db/node_modules/.bin/prisma"]
    command: ["migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: deploys OKFAnchor to `chain` as the deployer's first-ever tx, so it always
  # lands at the same address (see EVM_ANCHOR_CONTRACT_ADDRESS in .env.example). Exits 0
  # and stays stopped; `app`/`worker` wait for that exit before starting.
  contracts:
    image: ghcr.io/foundry-rs/foundry:v1.0.0
    restart: "no"
    working_dir: /contracts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "forge script script/DeployOKFAnchor.s.sol --rpc-url http://chain:8545 --broadcast"
    env_file:
      - .env
    volumes:
      - ./contracts:/contracts
    depends_on:
      chain:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
      REDIS_URL: redis://redis:6379
      # In-cluster Kubo hostname — always overridden here regardless of what a
      # host-side .env sets IPFS_API_URL to (which is typically the host-mapped
      # 127.0.0.1:55001, unreachable from inside this container).
      IPFS_API_URL: http://ipfs:5001
      # In-cluster Anvil hostname — same reasoning as IPFS_API_URL above (a
      # host-side .env typically sets EVM_RPC_URL to the host-mapped
      # 127.0.0.1:58545, unreachable from inside this container).
      EVM_RPC_URL: http://chain:8545
    ports:
      # Web app reachable at http://localhost:3002
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      contracts:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: ["node", "workers/dist/main.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://okf:okf_local_dev@postgres:5432/okf_anchor
      REDIS_URL: redis://redis:6379
      # In-cluster Kubo hostname — always overridden here regardless of what a
      # host-side .env sets IPFS_API_URL to (which is typically the host-mapped
      # 127.0.0.1:55001, unreachable from inside this container).
      IPFS_API_URL: http://ipfs:5001
      # In-cluster Anvil hostname — same reasoning as IPFS_API_URL above (a
      # host-side .env typically sets EVM_RPC_URL to the host-mapped
      # 127.0.0.1:58545, unreachable from inside this container).
      EVM_RPC_URL: http://chain:8545
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      contracts:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  ipfs-data:
