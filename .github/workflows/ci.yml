name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://okf:okf_local_dev@localhost:5432/okf_anchor
  REDIS_URL: redis://localhost:6379
  STORAGE_PROVIDER: local
  ANCHOR_PROVIDER: local
  GRAPH_PROVIDER: local
  SIGNER: local
  OKF_DATA_DIR: ${{ github.workspace }}/.data/okf

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @okf-anchor/db generate
      - run: pnpm -r --workspace-concurrency=1 --filter "./packages/**" run build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (no DB)
        run: |
          pnpm --filter @okf-anchor/okf-core run test
          pnpm --filter @okf-anchor/providers run test

  integration-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_USER: okf, POSTGRES_PASSWORD: okf_local_dev, POSTGRES_DB: okf_anchor }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U okf" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      ipfs:
        image: ipfs/kubo:v0.32.1
        ports: ["5001:5001"]
        options: >-
          --health-cmd "ipfs id || exit 1" --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @okf-anchor/db generate
      - run: pnpm -r --workspace-concurrency=1 --filter "./packages/**" run build
      - name: Migrate
        run: pnpm --filter @okf-anchor/db exec prisma migrate deploy
      - name: Integration tests (pipeline against Postgres)
        run: pnpm --filter @okf-anchor/pipeline run test
      - name: Integration tests (providers + pipeline against real Kubo)
        env:
          IPFS_API_URL: http://localhost:5001
        run: |
          pnpm --filter @okf-anchor/providers run test
          pnpm --filter @okf-anchor/pipeline run test
      - name: Build app + worker
        run: |
          pnpm --filter @okf-anchor/workers run build
          pnpm --filter @okf-anchor/web run build
      - name: Playwright (local storage)
        run: |
          pnpm --filter @okf-anchor/web exec playwright install --with-deps chromium
          pnpm --filter @okf-anchor/db run seed
          pnpm --filter @okf-anchor/web run test:e2e
      - name: Playwright (IPFS storage)
        env:
          STORAGE_PROVIDER: ipfs
          IPFS_API_URL: http://localhost:5001
          OKF_E2E_PORT: 3101
        run: pnpm --filter @okf-anchor/web run test:e2e

  evm-anchor:
    runs-on: ubuntu-latest
    env:
      # Anvil's well-known, publicly documented dev account #0 — dev/CI only.
      EVM_SIGNER_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      EVM_RPC_URL: http://localhost:58545
      EVM_CHAIN_ID: "31337"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @okf-anchor/okf-core --filter @okf-anchor/providers run build
      - name: Start Anvil
        run: |
          docker run -d --name chain -p 58545:8545 ghcr.io/foundry-rs/foundry:v1.0.0 \
            anvil --host 0.0.0.0 --chain-id 31337
          for i in $(seq 1 20); do
            docker run --rm --network host ghcr.io/foundry-rs/foundry:v1.0.0 \
              cast block-number --rpc-url http://localhost:58545 && break
            sleep 2
          done
      - name: Build + test contracts (Foundry)
        run: |
          docker run --rm -v ${{ github.workspace }}/contracts:/contracts -w /contracts \
            --entrypoint /bin/sh ghcr.io/foundry-rs/foundry:v1.0.0 -c \
            "forge install foundry-rs/forge-std --no-commit --no-git && forge build && forge test -vv"
      - name: Deploy OKFAnchor to Anvil
        run: |
          docker run --rm --network host -v ${{ github.workspace }}/contracts:/contracts -w /contracts \
            -e EVM_SIGNER_PRIVATE_KEY="$EVM_SIGNER_PRIVATE_KEY" \
            --entrypoint /bin/sh ghcr.io/foundry-rs/foundry:v1.0.0 -c \
            "forge script script/DeployOKFAnchor.s.sol --rpc-url $EVM_RPC_URL --broadcast" | tee deploy.log
          echo "EVM_ANCHOR_CONTRACT_ADDRESS=$(grep -oP 'OKFAnchor deployed at: \K0x[0-9a-fA-F]{40}' deploy.log)" >> "$GITHUB_ENV"
      - name: Integration tests (providers against real Anvil)
        run: pnpm --filter @okf-anchor/providers run test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
